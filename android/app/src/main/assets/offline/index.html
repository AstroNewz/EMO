<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>EMO — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      background: #000000;
      color: #E8E8E8;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }

    #stage { position: fixed; inset: 0; background: #000000; cursor: pointer; }
    #face {
      position: absolute; inset: 0; display: block;
      image-rendering: pixelated; image-rendering: crisp-edges;
      filter: drop-shadow(0 0 3px rgba(255,255,255,0.6)) drop-shadow(0 0 9px rgba(255,107,53,0.3));
    }

    .hud-overlay {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 10;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(16px);
      pointer-events: auto;
    }
    .meter-group { display: flex; gap: 16px; font-size: 11px; }
    .meter-val { font-weight: 700; color: #FF6B35; }

    .offline-banner {
      align-self: center; text-align: center; padding: 14px 20px;
      background: rgba(255, 107, 53, 0.1); border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 14px; backdrop-filter: blur(16px); pointer-events: auto;
    }
    .title { font-size: 12px; font-weight: 700; color: #FF6B35; letter-spacing: 2px; }
    .sub { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="face"></canvas>
  </div>

  <div class="hud-overlay">
    <div class="top-bar">
      <div class="meter-group">
        <div>BATTERY: <span class="meter-val" id="bat-val">⚡ --%</span></div>
        <div>RAM: <span class="meter-val" id="ram-val">-- MB</span></div>
      </div>
      <div>UPTIME: <span class="meter-val" id="up-val">--h --m</span></div>
    </div>

    <div class="offline-banner">
      <div class="title">◉ EMO OFFLINE MODE</div>
      <div class="sub">Hardware Diagnostics Active · Waiting for 127.0.0.1:3000...</div>
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById("face");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, DPR = 1, CELL = 8;
    let cx = 0, cy = 0, eyeR = 0, gap = 0;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      W = window.innerWidth; H = window.innerHeight;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = false;
      CELL = Math.max(5, Math.round(Math.min(W, H) / 54));
    }

    const WHITE = "#FFFFFF", GAP = 0.15;
    function cell(gx, gy) {
      const i = CELL * GAP;
      ctx.fillStyle = WHITE;
      ctx.fillRect(gx * CELL + i, gy * CELL + i, CELL - 2 * i, CELL - 2 * i);
    }
    function circleGrid(cgx, cgy, r) {
      const r2 = r * r;
      for (let y = -r; y <= r; y++) {
        for (let x = -r; x <= r; x++) { if (x * x + y * y <= r2) cell(cgx + x, cgy + y); }
      }
    }
    function rectGrid(gx, gy, w, h) {
      for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) cell(gx + x, gy + y); }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      cx = Math.floor((W / CELL) / 2);
      cy = Math.floor((H / CELL) / 2) - 2;
      eyeR = Math.max(5, Math.round(Math.min(W, H) / (CELL * 10)));
      gap = eyeR + 3;

      // Draw offline resting eyes & mouth
      circleGrid(cx - gap, cy, eyeR);
      circleGrid(cx + gap, cy, eyeR);
      rectGrid(cx - 3, cy + 11, 6, 2);

      requestAnimationFrame(render);
    }

    resize();
    window.addEventListener("resize", resize);
    render();

    // Native Bridge Telemetry
    function updateBridge() {
      if (typeof Android === "undefined") return;
      try {
        const bat = JSON.parse(Android.getBattery());
        document.getElementById("bat-val").textContent = `${bat.charging ? '⚡' : '🔋'} ${bat.level}%`;
      } catch (_) {}
      try {
        const ram = JSON.parse(Android.getRAM());
        document.getElementById("ram-val").textContent = `${(ram.used / 1024).toFixed(1)}GB`;
      } catch (_) {}
      try {
        const secs = Android.getUptime();
        const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
        document.getElementById("up-val").textContent = `${h}h ${m}m`;
      } catch (_) {}
    }
    setInterval(updateBridge, 2000);
  })();
  </script>
</body>
</html>
